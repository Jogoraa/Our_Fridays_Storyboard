[project]
name = "our-fridays"
version = "0.1.0"
description = "A storyboard-driven pipeline that generates the short film 'Our Fridays'."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.21",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
film = "pipeline.run:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
